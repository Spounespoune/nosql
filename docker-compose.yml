version: '3.8'

services:
  phpfpm:
    image: php:8.3-fpm
    container_name: phpfpm
    build: docker/php
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html:cached # Monte le répertoire local dans le conteneur
      - .docker/php/php.ini:/usr/local/etc/php/php.ini # Optionnel : fichier de configuration PHP personnalisé
    depends_on:
      - mongodb
      - mysql
    networks:
      - app-network

  mongodb:
    image: mongo:latest # Utilise la dernière version de MongoDB
    container_name: mongodb
    ports:
      - "27017:27017" # Expose le port MongoDB par défaut
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db # Monte un volume pour les données persistantes
    networks:
      - app-network

  webserver:
    image: nginx:latest
    container_name: nginx
    volumes:
      - ./public:/var/www/html:ro,cached
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf # Utilisez un fichier de configuration nginx personnalisé
    ports:
      - "8080:80"
    depends_on:
      - phpfpm
    networks:
      - app-network

  #graphql:
    #build:
      #context: ./docker/graphql
    #container_name: graphql
    #ports:
      #- "4000:4000"
    #networks:
      #- app-network

  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: base
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network

  elasticsearch:
    image: elasticsearch:8.16.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.transport.ssl.enabled=false
      - xpack.security.enabled=true
      - xpack.security.authc.apiKey.enabled=true
      - ELASTIC_PASSWORD=test
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app-network

  kibana:
    image: kibana:8.16.1
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana
      - ELASTICSEARCH_PASSWORD=test00
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - app-network

volumes:
  mongodb_data:
    driver: local
  mysql_data:
    driver: local
  elasticsearch_data:
    driver: local

networks:
  app-network:
    driver: bridge
